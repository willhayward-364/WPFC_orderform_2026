    const CATEGORIES = ['All', 'Match Kit', 'Goalkeeper', 'Training & Outerwear', 'Accessories'];

    // =========================================================================
    // 4. APPLICATION STATE & STORAGE (Coach Wizard + Club Official Portal)
    // =========================================================================
    const STORAGE_KEY_SUBMISSIONS = 'wpfc_coach_submissions_v1';
    function detectOfficialView() {
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.get('view') === 'official') return true;
      } catch (e) {}
      return (window.location.hash || '').toLowerCase().includes('official');
    }

    function loadStoredSubmissions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_SUBMISSIONS);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    let orderRevision = 0;
    let saveQueue = Promise.resolve();
    let saveGeneration = 0;

    async function api(path, method = 'GET', body) {
      const response = await fetch(path, {
        method,
        headers: method === 'GET' ? {} : { 'Content-Type': 'application/json', 'X-WPFC-Request': '1' },
        body: method === 'GET' ? undefined : JSON.stringify(body || {})
      });
      if (!response.ok) {
        const error = new Error(response.status === 409
          ? 'Orders changed on another device. Your unsaved change was not saved; review the refreshed orders.'
          : response.status === 401 ? 'Sign in required or invalid credentials.' : 'Shared storage is unavailable or the order data is invalid.');
        error.status = response.status;
        throw error;
      }
      return response.json();
    }

    async function refreshSubmissions() {
      const result = await api('/api/orders');
      state.submissions = result.orders;
      state.audit = result.audit;
      orderRevision = result.revision;
      renderAll();
    }

    function saveStoredSubmissions(list) {
      const snapshot = JSON.parse(JSON.stringify(list));
      const generation = saveGeneration;
      saveQueue = saveQueue.then(async () => {
        if (generation !== saveGeneration) return;
        try {
          const result = await api('/api/orders', 'PUT', { orders: snapshot, revision: orderRevision });
          orderRevision = result.revision;
        } catch (error) {
          saveGeneration++;
          state.storageError = error.message;
          if (error.status === 401) {
            state.officialUser = null;
            state.submissions = [];
            state.loginForm.error = 'Your session expired. Sign in again; your unsaved changes were not saved.';
            renderAll();
          } else {
            try { await refreshSubmissions(); } catch (_) {
              state.officialUser = null;
              state.submissions = [];
              state.loginForm.error = 'Could not save or refresh orders. Sign in again and reapply your changes.';
              renderAll();
            }
          }
        }
      });
    }

    const state = {

      return String(str)

        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      container.innerHTML = `
        <div class="bg-red-600 text-white px-4 py-2 rounded-full shadow-2xl font-bold text-xs flex items-center gap-2 border border-red-400 whitespace-nowrap">
          ${ICONS.sparkles}

        </div>

      container.classList.remove('hidden');

    // =========================================================================
    function getTotalItemsCount() {
      return state.cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function getGrandTotal() {
      return state.cart.reduce((sum, item) => sum + (item.unitPrice * item.quantity), 0);
    }

    function getFilteredProducts() {
      const q = state.searchQuery.toLowerCase().trim();
      return PRODUCTS.filter(p => {
        const matchesCat = state.selectedCategory === 'All' || p.category === state.selectedCategory;
        const matchesSearch = !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });
    }

    function getExpandedPersonalisationUnits() {
      const units = [];
      state.cart.forEach(item => {
        if (item.requiresNumber || item.requiresInitials) {
          for (let i = 0; i < item.quantity; i++) {
            units.push({
              unitKey: `${item.cartItemId}_unit_${i}`,
              cartItemId: item.cartItemId,
              productId: item.productId,
              name: item.name,
              sku: item.sku,
              sizeLabel: item.sizeLabel,
              unitNumber: i + 1,
              totalQuantity: item.quantity,
              requiresNumber: item.requiresNumber,
              requiresInitials: item.requiresInitials
            });
          }
        }
      });
      return units;
    }

    function getSquadNumberUnitsBySku() {
      const grouped = {};
      getExpandedPersonalisationUnits().forEach(unit => {
        if (unit.requiresNumber) {
          if (!grouped[unit.sku]) grouped[unit.sku] = [];
          grouped[unit.sku].push(unit);
        }
      });
      return grouped;
    }

    function getSkuPersonalisationAnalysis() {
      const grouped = getSquadNumberUnitsBySku();
      const analysis = {};

      Object.keys(grouped).forEach(sku => {
        const units = grouped[sku];
        const counts = {};
        const assigned = [];

        units.forEach(u => {
          const val = (state.personalisationValues[u.unitKey] || '').trim();
          if (val && !isNaN(val)) {
            const num = parseInt(val, 10);
            assigned.push(num);
            counts[num] = (counts[num] || 0) + 1;
          }
        });

        const duplicates = new Set(
          Object.keys(counts)
            .filter(numStr => counts[numStr] > 1)
            .map(numStr => parseInt(numStr, 10))
        );

        let nextFree = 1;
        while (assigned.includes(nextFree) && nextFree <= 99) {
          nextFree++;
        }

        analysis[sku] = {
          assignedList: Array.from(new Set(assigned)).sort((a, b) => a - b),
          duplicates,
          nextFree: nextFree <= 99 ? nextFree : null
        };
      });

      return analysis;
    }

    function getPersonalisationErrorSummary() {
      const units = getExpandedPersonalisationUnits();
      const analysis = getSkuPersonalisationAnalysis();
      let duplicateCount = 0;

      units.forEach(unit => {
        if (unit.requiresNumber) {
          const val = (state.personalisationValues[unit.unitKey] || '').trim();
          if (val) {
            const num = parseInt(val, 10);
            if (analysis[unit.sku] && analysis[unit.sku].duplicates.has(num)) {
              duplicateCount++;
            }
          }
        }
      });

      return {
        hasErrors: duplicateCount > 0,
        duplicateCount
      };
    }

        return {

    function buildCSVContent() {
      const finalizedItems = getFinalizedOrderItems();
      const grandTotal = getGrandTotal();
      let csvContent = "Coach Name,Team / Age Group,SKU Code,Item Description,Size,Quantity,Unit Price (£),Line Total (£),Squad Numbers,Initials,Club Official Checked\n";

      finalizedItems.forEach(item => {

        const sku = `"${item.sku}"`;

        const size = `"${item.sizeLabel}"`;
        const qty = item.quantity;
        const unitPrice = item.unitPrice.toFixed(2);
        const lineTotal = item.lineTotal.toFixed(2);

        const numbersStr = item.requiresNumber
          ? (item.personalisations.length > 0 ? item.personalisations.map(n => `#${n}`).join(' | ') : 'None specified')
          : 'N/A';
        const initialsStr = item.requiresInitials
          ? (item.personalisations.length > 0 ? item.personalisations.join(' | ') : 'None specified')
          : 'N/A';

        csvContent += `${coach},${team},${sku},${name},${size},${qty},${unitPrice},${lineTotal},"${numbersStr.replace(/"/g, '""')}","${initialsStr.replace(/"/g, '""')}","[ ]"\n`;

      csvContent += `,,,,,,GRAND TOTAL (£):,${grandTotal.toFixed(2)},,,\n`;

    function goToStep(step) {

      if (step > 2 && state.cart.length === 0) {

      state.currentStep = step;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });

    function handleSquadNumberChange(unitKey, rawVal) {
      let warning = null;
      if (/\D/.test(rawVal)) {
        warning = 'Numeric digits only allowed (1–99)';
      }
      let cleaned = rawVal.replace(/\D/g, '');
      if (cleaned.length > 0) {
        cleaned = String(parseInt(cleaned, 10) || '');
      }
      if (cleaned.length > 2) {
        cleaned = cleaned.slice(0, 2);
        warning = 'Maximum 2 digits allowed (numbers 1–99 only)';
      }
      if (cleaned && parseInt(cleaned, 10) > 99) {
        cleaned = '99';
        warning = 'Maximum squad number allowed is 99';
      }

      state.unitValidationWarnings[unitKey] = warning;
      state.personalisationValues[unitKey] = cleaned;
      renderMainAndRestoreFocus(unitKey);
    }

    function triggerBlobDownload(content, mimeType, filename) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // Submit Formatted Order Attachment to Club for Checking
    function submitOrderEmail() {
      const attempt = ++submissionAttempt;
      state.submissionStatus = '';
      renderMain();
      const recipient = 'whitburnpanthers@gmail.com';
      const subject = getEmailSubject();
      const coverNote = getShortEmailCoverNote();
      const htmlContent = buildFormattedOrderSheetHTML();
      const filename = getOrderFilename('html');

      // 1. Mobile Native Share Sheet (attaches formatted order sheet file directly into Mail / Gmail)
      try {
        const orderFile = new File([htmlContent], filename, { type: 'text/html' });
        if (navigator.canShare && navigator.canShare({ files: [orderFile] })) {
          navigator.share({
            title: subject,
            text: coverNote,
            files: [orderFile]
          }).then(() => {
            if (attempt !== submissionAttempt || state.viewMode !== 'coach') return;
            state.submissionStatus = 'shared';
            renderMain();
          }).catch((err) => {
            if (attempt !== submissionAttempt || state.viewMode !== 'coach') return;
            if (err && err.name !== 'AbortError') {
              fallbackDownloadAndMailto(htmlContent, filename, recipient, subject, coverNote);
            }
          });
          showToast('Select your Mail app to send with attachment...');
          return;
        }
      } catch (e) {
        // Fall through to desktop/standard browser workflow
      }

      // 2. Desktop / Fallback Workflow: Download formatted file attachment + open concise email
      fallbackDownloadAndMailto(htmlContent, filename, recipient, subject, coverNote);
    }

    function fallbackDownloadAndMailto(htmlContent, filename, recipient, subject, coverNote) {
      try {
        triggerBlobDownload(htmlContent, 'text/html;charset=utf-8;', filename);
      } catch (e) {
        showToast('Unable to download file in this browser view.');
        return;
      }

      const mailtoUrl = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(coverNote)}`;

      try {
        const a = document.createElement('a');
        a.href = mailtoUrl;
        a.target = '_top';
        a.rel = 'noopener noreferrer';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (e) {
        window.location.href = mailtoUrl;
      }

      state.submissionStatus = 'email';
      renderMain();
      showToast(`Downloaded ${filename} & opened email!`);
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          result.push(current);
          current = '';
        } else {
          current += ch;
        }
      }
      result.push(current);
      return result;
    }

    function parseImportedFileText(fileName, text) {
      // 1. Check for embedded WPFC JSON payload in .html attachment
      const jsonMatch = text.match(/<script[^>]*id=["']wpfc-order-payload["'][^>]*>([\s\S]*?)<\/script>/i);
      if (jsonMatch && jsonMatch[1]) {
        const data = JSON.parse(jsonMatch[1].trim());
        if (data && data.schema === 'WPFC_ORDER_V1' && Array.isArray(data.items)) {
          return {
            id: typeof data.orderId === 'string' && /^[A-Za-z0-9_-]{1,128}$/.test(data.orderId)
              ? data.orderId : `IMP-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            submittedAt: String(data.submittedAt || new Date().toISOString()),
            coachName: String(data.coachName || 'Imported Coach'),
            teamName: String(data.teamName || 'Imported Team'),
            totalItems: Number(data.totalItems || data.items.reduce((s, it) => s + (Number(it.quantity) || 0), 0)),
            grandTotal: Number(data.grandTotal || data.items.reduce((s, it) => s + (Number(it.lineTotal) || 0), 0)),
            status: 'pending',
            officialNote: '',
            items: data.items.map(it => ({
              productId: String(it.productId || it.sku || ''),
              sku: String(it.sku || ''),
              name: String(it.name || ''),
              category: String(it.category || 'Kit Item'),
              sizeCode: String(it.sizeCode || it.sizeLabel || ''),
              sizeLabel: String(it.sizeLabel || ''),
              quantity: Number(it.quantity) || 1,
              unitPrice: Number(it.unitPrice) || 0,
              lineTotal: Number(it.lineTotal) || 0,
              requiresNumber: Boolean(it.requiresNumber),
              requiresInitials: Boolean(it.requiresInitials),
              personalisations: Array.isArray(it.personalisations) ? it.personalisations.map(String) : [],
              checked: false
            }))
          };
        }
      }

      // 2. Fallback CSV parser for exported coach .csv spreadsheets
      if (fileName.toLowerCase().endsWith('.csv') || text.includes('SKU Code,Item Description')) {
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        if (lines.length >= 2) {
          let coachName = 'Imported Coach';
          let teamName = 'Imported Team';
          const items = [];

          for (let i = 1; i < lines.length; i++) {
            const cols = parseCSVLine(lines[i]);
            if (cols.length < 8) continue;
            if ((cols[6] || '').includes('GRAND TOTAL')) continue;
            if (!cols[2] && !cols[3]) continue;

            coachName = cols[0] || coachName;
            teamName = cols[1] || teamName;
            const sku = cols[2] || 'UNKNOWN';
            const name = cols[3] || sku;
            const sizeLabel = cols[4] || 'Standard';
            const quantity = parseInt(cols[5], 10) || 1;
            const unitPrice = parseFloat(cols[6]) || 0;
            const lineTotal = parseFloat(cols[7]) || (unitPrice * quantity);
            const rawNums = (cols[8] || '').trim();
            const rawInits = (cols[9] || '').trim();

            const catalogMatch = PRODUCTS.find(p => p.sku === sku);
            let personalisations = [];
            let requiresNumber = catalogMatch ? catalogMatch.requiresNumber : false;
            let requiresInitials = catalogMatch ? catalogMatch.requiresInitials : false;

            if (rawNums && rawNums !== 'N/A' && rawNums !== 'None specified') {
              requiresNumber = true;
              personalisations = rawNums.split('|').map(s => s.replace(/#/g, '').trim()).filter(Boolean);
            } else if (rawInits && rawInits !== 'N/A' && rawInits !== 'None specified') {
              requiresInitials = true;
              personalisations = rawInits.split('|').map(s => s.trim()).filter(Boolean);
            }

            items.push({
              productId: sku,
              sku,
              name,
              category: catalogMatch ? catalogMatch.category : 'Kit Item',
              sizeCode: sizeLabel,
              sizeLabel,
              quantity,
              unitPrice,
              lineTotal: Number(lineTotal.toFixed(2)),
              requiresNumber,
              requiresInitials,
              personalisations,
              checked: false
            });
          }

          if (items.length > 0) {
            return {
              id: `CSV-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              submittedAt: new Date().toISOString(),
              coachName,
              teamName,
              totalItems: items.reduce((s, it) => s + it.quantity, 0),
              grandTotal: Number(items.reduce((s, it) => s + it.lineTotal, 0).toFixed(2)),
              status: 'pending',
              officialNote: '',
              items
            };
          }
        }
      }

      return null;
    }

    function handleImportOrderFiles(fileList) {
      if (!fileList || fileList.length === 0) return;
      const files = Array.from(fileList);
      let importedCount = 0;
      let processed = 0;

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsedOrder = parseImportedFileText(file.name, String(e.target.result || ''));
            if (parsedOrder) {
              const dupIdx = state.submissions.findIndex(s => s.id === parsedOrder.id);
              if (dupIdx === -1) {
                state.submissions.unshift(parsedOrder);
                state.expandedOrderIds[parsedOrder.id] = true;
                importedCount++;
              }
            }
          } catch (err) {}

          processed++;
          if (processed === files.length) {
            saveStoredSubmissions(state.submissions);
            renderAll();
            if (importedCount > 0) {
              showToast(`Imported ${importedCount} coach order file${importedCount === 1 ? '' : 's'}!`);
            } else {
              showToast('No new valid WPFC orders found in selected file(s).');
            }
          }
        };
        reader.readAsText(file);
      });
    }

    function getConsolidatedSummary() {
      const approved = getApprovedSubmissions();
      const aggregatedMap = {};
      let totalUnits = 0;
      let totalCost = 0;

      approved.forEach(order => {
        order.items.forEach(item => {
          totalUnits += item.quantity;
          totalCost += item.lineTotal;
          const groupKey = `${item.sku}__${item.sizeLabel}`;

          if (!aggregatedMap[groupKey]) {
            aggregatedMap[groupKey] = {
              groupKey,
              sku: item.sku,
              name: item.name,
              category: item.category,
              sizeLabel: item.sizeLabel,
              unitPrice: item.unitPrice,
              totalQuantity: 0,
              totalLineCost: 0,
              requiresNumber: item.requiresNumber,
              requiresInitials: item.requiresInitials,
              breakdowns: []
            };
          }

          const entry = aggregatedMap[groupKey];
          entry.totalQuantity += item.quantity;
          entry.totalLineCost += item.lineTotal;
          entry.breakdowns.push({
            teamName: order.teamName,
            coachName: order.coachName,
            quantity: item.quantity,
            personalisations: item.personalisations || []
          });
        });
      });

      const consolidatedRows = Object.values(aggregatedMap).sort((a, b) => a.sku.localeCompare(b.sku));

      return {
        approvedOrders: approved,
        consolidatedRows,
        totalUnits,
        totalCost: Number(totalCost.toFixed(2))
      };
    }

    function buildConsolidatedTotalSportCSV() {
      const summary = getConsolidatedSummary();
      let csv = 'SKU Code,Product Description,Size,Total Quantity,Unit Price (£),Line Total (£),Team & Personalisation Breakdown\n';

      summary.consolidatedRows.forEach(row => {
        const breakdownStr = row.breakdowns.map(b => {
          let pers = '';
          if (row.requiresNumber && b.personalisations.length > 0) {
            pers = ` [Nos: ${b.personalisations.map(n => `#${n}`).join(', ')}]`;
          } else if (row.requiresInitials && b.personalisations.length > 0) {
            pers = ` [Initials: ${b.personalisations.join(', ')}]`;
          }

    function sendConsolidatedOrderToTotalSport() {
      const summary = getConsolidatedSummary();
      if (summary.approvedOrders.length === 0) {
        showToast('Please verify and approve at least one coach order first');
        return;
      }

      const htmlContent = buildConsolidatedTotalSportHTML();
      const filename = `WPFC_Total_Sport_Consolidated_Order_${new Date().toISOString().slice(0, 10)}.html`;
      const teamsList = summary.approvedOrders.map(o => o.teamName).join(', ');
      const subject = `WHITBURN PANTHERS FC - CONSOLIDATED KIT ORDER 2026 (${summary.approvedOrders.length} Squads / ${summary.totalUnits} Items)`;
      const coverBody = [
        `Hi Total Sport Team,`,
        ``,
        `Please find attached the approved consolidated 2026 kit order for Whitburn Panthers FC.`,
        `Squads Included: ${teamsList}`,
        `Total Garments / Items: ${summary.totalUnits} | Order Total: £${summary.totalCost.toFixed(2)}`,
        `Approved By: ${state.officialUser ? state.officialUser.name : 'Club Official'}`,
        ``,
        `Please confirm receipt and expected lead times.`,
        `Kind regards,`,
        `Whitburn Panthers FC (whitburnpanthers@gmail.com)`
      ].join('\n');

      try {
        const fileObj = new File([htmlContent], filename, { type: 'text/html' });
        if (navigator.canShare && navigator.canShare({ files: [fileObj] })) {
          navigator.share({
            title: subject,
            text: `Subject: ${subject}\n\n${coverBody}`,
            files: [fileObj]
          }).catch(() => {});
          showToast('Select Mail app to send consolidated order to Total Sport...');
          return;
        }
      } catch (e) {}

      triggerBlobDownload(htmlContent, 'text/html;charset=utf-8;', filename);
      const mailtoUrl = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(coverBody + '\n\n[Attached File: ' + filename + ']')}`;
      try {
        const a = document.createElement('a');
        a.href = mailtoUrl;
        a.target = '_top';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (e) {
        window.location.href = mailtoUrl;
      }
      showToast(`Downloaded ${filename} & opened email for Total Sport!`);
    }

              ${state.submissions.length === 0 ? `
                <button

                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
              >
                <option value="all" ${state.officialTeamFilter === 'all' ? 'selected' : ''}>All teams</option>
                ${teams.map(team => `<option value="${escapeHtml(team)}" ${state.officialTeamFilter === team ? 'selected' : ''}>${escapeHtml(team)}</option>`).join('')}
              </select>
            </label>
            <label class="space-y-1">
              <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">From date</span>
              <input
                type="date"

                data-official-filter="officialDateFrom"
                onchange="updateOfficialOrderFilter('officialDateFrom', this.value)"
                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
              />

            <label class="space-y-1">
              <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">To date</span>

                onchange="updateOfficialOrderFilter('officialDateTo', this.value)"

              >
                <option value="date-desc" ${state.officialSort === 'date-desc' ? 'selected' : ''}>Newest date</option>
                <option value="date-asc" ${state.officialSort === 'date-asc' ? 'selected' : ''}>Oldest date</option>
                <option value="team-asc" ${state.officialSort === 'team-asc' ? 'selected' : ''}>Team (A–Z)</option>
                <option value="team-desc" ${state.officialSort === 'team-desc' ? 'selected' : ''}>Team (Z–A)</option>
              </select>
            </label>
          </div>

          <!-- FILTER TABS -->
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div class="flex gap-2 overflow-x-auto no-scrollbar text-xs">
              ${[
                { id: 'all', label: `All (${state.submissions.length})` },
                { id: 'pending', label: `Needs Review (${pendingCount})` },

            <span class="text-[11px] text-slate-500">

            </span>
          </div>

          <!-- COACH SUBMISSIONS LIST -->
          <div class="space-y-3">
            ${filteredOrders.length === 0 ? `
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center space-y-2">
                <p class="text-sm font-bold text-slate-300">No coach orders in this view yet.</p>
                <p class="text-xs text-slate-500">

                </p>
              </div>
            ` : filteredOrders.map(order => {
              const isExpanded = Boolean(state.expandedOrderIds[order.id]);
              const checkedCount = order.items.filter(i => i.checked).length;
              const statusBadge = order.status === 'approved'
                ? '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-emerald-950 text-emerald-300 border border-emerald-700">Approved for Order</span>'
                : order.status === 'sent'
                  ? '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-sky-950 text-sky-300 border border-sky-700">Sent to Total Sport</span>'
                  : '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-amber-950 text-amber-300 border border-amber-700">Needs Review</span>';

              const dateLabel = (() => {
                try {
                  const dateValue = order.status === 'sent' && order.sentAt ? order.sentAt : order.submittedAt;
                  return new Date(dateValue).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                } catch (e) {
                  return 'Recent';

              })();

              return `
                <div class="bg-slate-900 border ${order.status === 'approved' ? 'border-emerald-700/70' : 'border-slate-800'} rounded-2xl overflow-hidden shadow-lg">

                    <div class="space-y-1">
                      <div class="flex items-center gap-2 flex-wrap">
                        ${statusBadge}
                        <span class="text-[11px] text-slate-400 font-medium">${escapeHtml(dateLabel)}</span>
                        <span class="text-[11px] text-slate-500 font-mono">(${checkedCount}/${order.items.length} lines checked)</span>
                      </div>
                      <h3 class="font-black text-white text-base">
                        ${escapeHtml(order.teamName)} <span class="text-slate-400 font-semibold text-xs">&bull; Coach: ${escapeHtml(order.coachName)}</span>

                    </div>

                    <div class="flex items-center justify-between sm:justify-end gap-2.5">
                      <div class="text-left sm:text-right mr-1">
                        <span class="text-[10px] text-slate-400 block">${order.totalItems} items</span>
                        <span class="font-black text-base text-white">£${Number(order.grandTotal).toFixed(2)}</span>
                      </div>

                      <button
                        type="button"
                        onclick="toggleOrderApproval('${order.id}')"

                            ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow'
                            : 'bg-slate-800 hover:bg-emerald-700 text-slate-200 hover:text-white border border-slate-700'

                      >
                        ${ICONS.check}
                        <span>${order.status === 'approved' ? 'Approved' : 'Approve'}</span>
                      </button>

                      <button
                        type="button"
                        onclick="toggleOrderExpanded('${order.id}')"

                        title="Expand itemized details"
                      >
                        ${isExpanded ? ICONS.chevronDown : ICONS.chevronRight}
                      </button>
                    </div>
                  </div>

                  <!-- EXPANDED ITEMIZED VERIFICATION DRAWER -->
                  ${isExpanded ? `
                    <div class="border-t border-slate-800 bg-slate-950/70 p-4 space-y-4">
                      <div class="flex items-center justify-between flex-wrap gap-2">
                        <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">
                          Verify Itemized Lines (Tick each line after checking)
                        </span>
                        <button
                          type="button"
                          onclick="checkAllOrderItems('${order.id}')"
                          class="text-xs font-bold text-emerald-400 hover:text-emerald-300 underline"
                        >
                          Tick All Lines Verified
                        </button>
                      </div>

                      <div class="space-y-2">
                        ${order.items.map((item, idx) => `
                          <div
                            onclick="toggleLineItemChecked('${order.id}', ${idx})"
                            class="cursor-pointer bg-slate-900 border ${item.checked ? 'border-emerald-800/80 bg-emerald-950/10' : 'border-slate-800'} rounded-xl p-3 flex items-center justify-between gap-3 text-xs transition"

                            <div class="flex items-center gap-3 min-w-0">
                              <input
                                type="checkbox"
                                ${item.checked ? 'checked' : ''}
                                onclick="event.stopPropagation(); toggleLineItemChecked('${order.id}', ${idx});"
                                class="w-4 h-4 accent-emerald-500 rounded cursor-pointer flex-shrink-0"
                              />
                              ${getKitThumbnailHTML(item.sku, item.name, 'w-11 h-11')}
                              <div class="min-w-0">
                                <p class="font-extrabold text-white truncate">
                                  ${escapeHtml(item.name)} <span class="text-[10px] font-mono text-slate-500">(${escapeHtml(item.sku)})</span>
                                </p>
                                <p class="text-slate-300">
                                  Size: <strong class="text-white">${escapeHtml(item.sizeLabel)}</strong> &bull; Qty: <strong class="text-white">${item.quantity}</strong> x £${Number(item.unitPrice).toFixed(2)}
                                </p>
                                ${item.requiresNumber ? `
                                  <p class="text-red-300 font-bold mt-0.5">
                                    Squad Numbers: ${item.personalisations && item.personalisations.length > 0 ? item.personalisations.map(n => `#${escapeHtml(n)}`).join(', ') : 'None specified'}
                                  </p>
                                ` : ''}
                                ${item.requiresInitials ? `
                                  <p class="text-amber-300 font-bold mt-0.5">
                                    Initials: ${item.personalisations && item.personalisations.length > 0 ? escapeHtml(item.personalisations.join(', ')) : 'None specified'}
                                  </p>
                                ` : ''}
                              </div>
                            </div>

                            <div class="text-right font-black text-white text-sm flex-shrink-0">
                              £${Number(item.lineTotal).toFixed(2)}
                            </div>
                          </div>
                        `).join('')}
                      </div>

                      <!-- OFFICIAL VERIFICATION NOTE & DELETE CONTROL -->
                      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2 border-t border-slate-800/80">
                        <input
                          type="text"
                          placeholder="Add club official verification note (optional)..."
                          value="${escapeHtml(order.officialNote || '')}"
                          onchange="updateOfficialNote('${order.id}', this.value)"
                          class="flex-1 bg-slate-900 border border-slate-700 rounded-xl py-2 px-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"
                        />

                        ${state.pendingDeleteId === order.id ? `
                          <div class="flex items-center gap-2 text-xs">
                            <span class="text-red-300 font-bold">Delete order?</span>
                            <button type="button" onclick="confirmDeleteSubmission('${order.id}')" class="bg-red-600 text-white font-bold px-2.5 py-1.5 rounded-lg">Yes</button>
                            <button type="button" onclick="cancelDeleteSubmission()" class="bg-slate-800 text-slate-300 font-bold px-2.5 py-1.5 rounded-lg">Cancel</button>
                          </div>
                        ` : `
                          <button
                            type="button"
                            onclick="requestDeleteSubmission('${order.id}')"
                            class="text-xs text-slate-500 hover:text-red-400 font-semibold flex items-center gap-1 self-end sm:self-center"
                          >
                            ${ICONS.trash}
                            <span>Remove</span>
                          </button>
                        `}
                      </div>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>

          <details class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-sm text-slate-300">
            <summary class="cursor-pointer font-bold text-white">Order audit history (${state.audit.length})</summary>
            <p class="text-xs text-slate-400 mt-2">Refresh shared orders to see the latest activity. Each entry retains the order as it was after the change, or before deletion.</p>
            <div class="space-y-2 mt-3">
              ${state.audit.map(entry => `
                <details class="border border-slate-700 rounded p-2">
                  <summary class="cursor-pointer">${escapeHtml(entry.at)} &bull; ${escapeHtml(entry.actor)} ${escapeHtml(entry.action)} ${escapeHtml(entry.order_id)}</summary>
                  <pre class="whitespace-pre-wrap break-all text-xs mt-2">${escapeHtml(JSON.stringify(JSON.parse(entry.data), null, 2))}</pre>
                </details>
              `).join('') || '<p class="text-xs text-slate-500">No activity yet.</p>'}
            </div>
          </details>

          <!-- 2. CONSOLIDATED TOTAL SPORT ORDER BUILDER -->
          <div class="bg-slate-900 border border-red-900/60 rounded-2xl p-5 sm:p-6 shadow-2xl space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
              <div>
                <span class="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded bg-red-950 text-red-300 border border-red-800">
                  Supplier Dispatch
                </span>
                <h2 class="text-lg font-black text-white mt-1 flex items-center gap-2">
                  <span>2. Consolidated Order for Total Sport</span>
                </h2>
                <p class="text-xs text-slate-400">
                  Combines all <strong class="text-emerald-400">${summary.approvedOrders.length} approved squad order(s)</strong> into a single supplier submission.
                </p>
              </div>

              <div class="text-left sm:text-right">
                <span class="text-[11px] text-slate-400 block">${summary.totalUnits} Total Items</span>
                <span class="text-2xl font-black text-red-500">£${summary.totalCost.toFixed(2)}</span>
              </div>
            </div>

            ${summary.approvedOrders.length === 0 ? `
              <div class="bg-slate-950 border border-slate-800 rounded-xl p-6 text-center text-xs text-slate-400">
                Click <strong class="text-white">Approve</strong> on one or more verified coach orders above to build your consolidated Total Sport order.
              </div>
            ` : `
              <!-- VIEW TOGGLE: BY SKU & SIZE VS BY TEAM -->
              <div class="flex items-center justify-between flex-wrap gap-2">
                <div class="inline-flex rounded-xl bg-slate-950 p-1 border border-slate-800 text-xs">
                  <button
                    type="button"
                    onclick="state.consolidatedGroupMode='sku'; renderMain();"
                    class="px-3 py-1.5 rounded-lg font-bold transition ${state.consolidatedGroupMode === 'sku' ? 'bg-red-600 text-white' : 'text-slate-400 hover:text-white'}"
                  >
                    Aggregated by SKU &amp; Size (${summary.consolidatedRows.length})
                  </button>
                  <button
                    type="button"
                    onclick="state.consolidatedGroupMode='team'; renderMain();"
                    class="px-3 py-1.5 rounded-lg font-bold transition ${state.consolidatedGroupMode === 'team' ? 'bg-red-600 text-white' : 'text-slate-400 hover:text-white'}"
                  >
                    By Team / Squad (${summary.approvedOrders.length})
                  </button>
                </div>

                <button
                  type="button"
                  onclick="markApprovedAsSent()"
                  class="text-xs font-bold text-sky-400 hover:text-sky-300 underline"
                >
                  Mark Approved Orders as Sent
                </button>
              </div>

              <!-- CONSOLIDATED PREVIEW LIST -->
              <div class="space-y-2 max-h-96 overflow-y-auto pr-1">
                ${state.consolidatedGroupMode === 'sku' ? summary.consolidatedRows.map(row => `
                  <div class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
                    <div class="flex items-start gap-3">
                      ${getKitThumbnailHTML(row.sku, row.name, 'w-12 h-12')}
                      <div class="space-y-1">
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="bg-red-600 text-white font-black px-2 py-0.5 rounded text-xs">
                            Qty: ${row.totalQuantity}
                          </span>
                          <span class="font-extrabold text-white">${escapeHtml(row.name)}</span>
                          <span class="font-mono text-[10px] text-slate-500">${escapeHtml(row.sku)}</span>
                        </div>
                        <p class="text-slate-300">
                          Size: <strong class="text-white">${escapeHtml(row.sizeLabel)}</strong> &bull; £${row.unitPrice.toFixed(2)} each
                        </p>
                        <div class="text-[11px] text-slate-400 space-y-0.5 pt-0.5">
                          ${row.breakdowns.map(b => {
                            let pers = '';
                            if (row.requiresNumber && b.personalisations.length > 0) {
                              pers = ` &mdash; <span class="text-red-300 font-bold">Nos: ${b.personalisations.map(n => `#${escapeHtml(n)}`).join(', ')}</span>`;
                            } else if (row.requiresInitials && b.personalisations.length > 0) {
                              pers = ` &mdash; <span class="text-amber-300 font-bold">Initials: ${escapeHtml(b.personalisations.join(', '))}</span>`;
                            }
                            return `<div>&bull; <strong class="text-slate-200">${escapeHtml(b.teamName)}</strong> (x${b.quantity})${pers}</div>`;
                          }).join('')}
                        </div>
                      </div>
                    </div>

                    <div class="text-right font-black text-sm text-white sm:border-l sm:border-slate-800 sm:pl-4">
                      £${row.totalLineCost.toFixed(2)}
                    </div>
                  </div>
                `).join('') : summary.approvedOrders.map(ord => `
                  <div class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 space-y-1.5 text-xs">
                    <div class="flex justify-between font-extrabold text-white border-b border-slate-800 pb-1.5">
                      <span>${escapeHtml(ord.teamName)} (Coach: ${escapeHtml(ord.coachName)})</span>
                      <span class="text-red-400">£${Number(ord.grandTotal).toFixed(2)}</span>
                    </div>
                    <ul class="space-y-1 text-slate-300 pl-3 list-disc">
                      ${ord.items.map(it => `
                        <li>
                          <strong>${it.quantity}x</strong> ${escapeHtml(it.name)} (${escapeHtml(it.sizeLabel)}) &mdash; £${Number(it.lineTotal).toFixed(2)}
                        </li>
                      `).join('')}
                    </ul>
                  </div>
                `).join('')}
              </div>

              <!-- SEND TO TOTAL SPORT ACTION BUTTONS -->
              <div class="space-y-2.5 pt-2">
                <button
                  type="button"
                  onclick="sendConsolidatedOrderToTotalSport()"
                  class="w-full bg-red-600 hover:bg-red-700 active:scale-[0.99] text-white font-extrabold py-4 rounded-xl shadow-xl transition flex items-center justify-center gap-2 text-base"
                >
                  ${ICONS.send}
                  <span>Send Consolidated Order Onwards to Total Sport</span>
                </button>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  <button
                    type="button"
                    onclick="downloadConsolidatedHTML()"
                    class="bg-slate-950 hover:bg-slate-800 border border-slate-700 text-slate-200 font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 text-xs"
                  >
                    <span class="text-red-400">${ICONS.fileText}</span>
                    <span>Download Supplier Order Sheet (.html)</span>
                  </button>

                  <button
                    type="button"
                    onclick="downloadConsolidatedCSV()"
                    class="bg-slate-950 hover:bg-slate-800 border border-slate-700 text-slate-200 font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 text-xs"
                  >
                    <span class="text-emerald-400">${ICONS.download}</span>
                    <span>Download Master Excel CSV (.csv)</span>
                  </button>
                </div>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderHeader() {
      if (state.viewMode === 'official') {
        renderOfficialHeader();
        return;
      }
      const totalItemsCount = getTotalItemsCount();
      const steps = [
        { step: 1, label: '1. Details' },
        { step: 2, label: '2. Select Kit' },
        { step: 3, label: '3. Personalise' },
        { step: 4, label: '4. Summary' }
      ];

      document.getElementById('app-header').innerHTML = `
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img src="IMG_4899.png" alt="Whitburn Panthers FC crest" class="w-10 h-10 object-contain flex-shrink-0" />
            <div>
              <h1 class="font-extrabold text-base sm:text-lg leading-tight tracking-wide text-white">
                WHITBURN PANTHERS FC
              </h1>
              <p class="text-xs text-red-400 font-semibold">Kit Order Portal 2026</p>
            </div>
          </div>

          <div class="flex items-center gap-2">
            ${totalItemsCount > 0 ? `
              <div class="bg-red-950 border border-red-800 text-red-300 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 shadow">
                ${ICONS.shoppingBag}
                <span>${totalItemsCount} ${totalItemsCount === 1 ? 'item' : 'items'}</span>
              </div>
            ` : ''}
          </div>
        </div>

        <div class="bg-slate-950 px-4 py-2 border-t border-slate-800/80">
          <div class="max-w-3xl mx-auto grid grid-cols-4 gap-1 text-[11px] font-semibold">
            ${steps.map(s => {
              const activeClass = state.currentStep === s.step
                ? 'bg-red-600 text-white font-bold shadow-md'
                : state.currentStep > s.step
                  ? 'bg-slate-800 text-slate-300'
                  : 'text-slate-500 bg-slate-900';
              return `
                <button type="button" onclick="goToStep(${s.step})" class="py-1.5 rounded text-center transition flex items-center justify-center gap-1 ${activeClass}">
                  <span>${s.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderCatalogItemsHTML() {
      const filtered = getFilteredProducts();
      if (filtered.length === 0) {
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-400 text-sm">
            No kit items match "${escapeHtml(state.searchQuery)}". Try clearing your search or switching categories.
          </div>
        `;
      }

      return filtered.map(product => {
        const minPrice = Math.min(...product.sizes.map(s => s.price));
        return `
          <div class="bg-slate-900 border border-slate-800 hover:border-red-900/50 rounded-2xl p-4 shadow-md transition flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              ${getKitThumbnailHTML(product.sku, product.name, 'w-16 h-16')}
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-[10px] font-bold text-red-400 bg-red-950 border border-red-800 px-2 py-0.5 rounded uppercase tracking-wider">
                    ${escapeHtml(product.category)}
                  </span>

                  <button
                    type="button"
                    onclick="downloadCSV()"
                    class="bg-slate-950 hover:bg-slate-800 border border-slate-700 text-slate-200 font-bold py-3 px-3 rounded-xl shadow transition flex items-center justify-center gap-2 text-xs"
                  >
                    <span class="text-emerald-400">${ICONS.download}</span>
                    <span>Download Excel Sheet (.csv)</span>
                  </button>
                </div>
                <p class="text-[10px] text-slate-500 text-center">
                  Both files include columns for SKU, Size, Qty, Squad Numbers, Initials, and a Club Official Check column.
                </p>
              </div>

              <button
                type="button"
                onclick="goToStep(2)"
                class="text-xs text-slate-400 hover:text-white underline block mx-auto py-2"
              >
                Edit Kit Items or Quantities
              </button>
            </div>
          </div>
        `;
      }

    }

    function renderModal() {
      const modalEl = document.getElementById('app-modal');
      if (!state.activeProduct) {
        modalEl.className = 'hidden';
        modalEl.innerHTML = '';
        return;
      }

      const product = state.activeProduct;
      const subtotal = state.selectedSize ? state.selectedSize.price * state.quantity : 0;

      modalEl.className = 'fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in';
      modalEl.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5 shadow-2xl space-y-5">
          <div class="flex items-start gap-3 border-b border-slate-800 pb-3">
            ${getKitThumbnailHTML(product.sku, product.name, 'w-16 h-16')}
            <div class="flex-1">
              <span class="text-[10px] font-bold text-red-400 bg-red-950 border border-red-800 px-2 py-0.5 rounded uppercase tracking-wider">
                ${escapeHtml(product.category)}
              </span>
              <h3 class="font-extrabold text-white text-lg mt-1 leading-snug">${escapeHtml(product.name)}</h3>
              <p class="text-xs font-mono text-slate-400">${escapeHtml(product.sku)}</p>
            </div>
            <button type="button" onclick="closeProductModal()" class="p-2 rounded-lg text-slate-400 hover:text-white bg-slate-950 border border-slate-800" aria-label="Close modal">
              ${ICONS.x}
            </button>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
              Select Size *
            </label>
            <div class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1">
              ${product.sizes.map(size => {
                const isSelected = state.selectedSize && state.selectedSize.code === size.code;
                return `
                  <button
                    type="button"
                    onclick="selectModalSize('${size.code}')"
                    class="p-3 rounded-xl border text-left flex justify-between items-center transition ${
                      isSelected
                        ? 'bg-red-600/20 border-red-500 text-white shadow'
                        : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-600'
                    }"
                  >
                    <span class="text-xs font-bold">${escapeHtml(size.label)}</span>
                    <span class="text-xs font-extrabold text-red-400">£${size.price.toFixed(2)}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="flex items-center justify-between border-t border-slate-800 pt-3">
            <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Quantity</span>
            <div class="flex items-center bg-slate-950 rounded-xl border border-slate-800">
              <button type="button" onclick="updateModalQuantity(-1)" class="p-3 text-slate-400 hover:text-white" aria-label="Decrease quantity">
                ${ICONS.minus}
              </button>
              <span class="w-10 text-center font-bold text-sm text-white">${state.quantity}</span>
              <button type="button" onclick="updateModalQuantity(1)" class="p-3 text-slate-400 hover:text-white" aria-label="Increase quantity">
                ${ICONS.plus}
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between border-t border-slate-800 pt-4">
            <div>
              <span class="text-[10px] text-slate-400 uppercase block font-medium">Subtotal</span>
              <span class="text-xl font-black text-red-500">£${subtotal.toFixed(2)}</span>
            </div>

            <button
              type="button"
              onclick="addToCartFromModal()"
              class="bg-red-600 hover:bg-red-700 active:scale-95 text-white font-extrabold px-6 py-3.5 rounded-xl shadow-lg transition flex items-center gap-2 text-sm"
            >
              ${ICONS.shoppingBag}
              <span>Add to Basket</span>
            </button>
          </div>
        </div>
      `;
    }

    function renderFooter() {
      const footerEl = document.getElementById('app-footer');
      if (state.viewMode === 'official' || state.currentStep !== 2) {
        footerEl.className = 'hidden';
        footerEl.innerHTML = '';
        return;
      }

      const totalItemsCount = getTotalItemsCount();
      const grandTotal = getGrandTotal();

      footerEl.className = 'fixed bottom-0 left-0 right-0 z-20 bg-slate-950/95 backdrop-blur-md border-t border-red-900/50 p-3 shadow-2xl';
      footerEl.innerHTML = `
        <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
          <div>
            <span class="text-[10px] text-slate-400 uppercase tracking-wider block font-medium">
              ${totalItemsCount} ${totalItemsCount === 1 ? 'item' : 'items'} selected
            </span>
            <span class="text-xl font-black text-white">£${grandTotal.toFixed(2)}</span>
          </div>

          <button
            type="button"
            onclick="goToStep(3)"
            class="bg-red-600 hover:bg-red-700 active:scale-95 text-white font-extrabold px-6 py-3.5 rounded-xl shadow-lg transition flex items-center gap-2 text-sm"
          >
            <span>Next: Personalisation</span>
            ${ICONS.chevronRight}
          </button>
        </div>
      `;
    }

    function renderAll() {
      renderHeader();
      renderMain();
      renderModal();
      renderFooter();
    }

    // Initialize Application
    renderAll();
    api('/api/session').then(async user => {
      state.officialUser = user;
      try { await refreshSubmissions(); } catch (_) {
        state.officialUser = null;
        renderAll();
      }
    }).catch(() => {});
  </script>
</body>
</html>
