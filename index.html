    body {

      color: #f1f5f9; /* slate-100 */
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hide horizontal scrollbar on category tabs while keeping touch scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.18s ease-out forwards;
    }
  </style>
</head>

      copiedSuccess: false
    };

    let toastTimeout = null;

    // Escape HTML helper for safe rendering
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Toast notification banner (never uses alert)
    function showToast(msg) {
      const container = document.getElementById('toast-container');
      container.innerHTML = `
        <div class="bg-red-600 text-white px-4 py-2 rounded-full shadow-2xl font-bold text-xs flex items-center gap-2 border border-red-400 animate-bounce whitespace-nowrap">
          ${ICONS.sparkles}
          <span>${escapeHtml(msg)}</span>
        </div>
      `;
      container.classList.remove('hidden');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        container.classList.add('hidden');
      }, 3000);
    }

    // =========================================================================
    // 5. DERIVED DATA & VALIDATION CALCULATIONS
    // =========================================================================
    function getTotalItemsCount() {
      return state.cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function getGrandTotal() {
      return state.cart.reduce((sum, item) => sum + (item.unitPrice * item.quantity), 0);
    }

    function getFilteredProducts() {
      const q = state.searchQuery.toLowerCase();
      return PRODUCTS.filter(product => {
        const matchesCategory = state.selectedCategory === 'All' || product.category === state.selectedCategory;
        const matchesSearch = product.name.toLowerCase().includes(q) || product.sku.toLowerCase().includes(q);
        return matchesCategory && matchesSearch;
      });
    }

    function getExpandedPersonalisationUnits() {
      const units = [];
      state.cart.forEach(item => {
        if (item.requiresNumber || item.requiresInitials) {
          for (let i = 0; i < item.quantity; i++) {
            units.push({
              unitKey: `${item.cartItemId}_unit_${i}`,
              cartItemId: item.cartItemId,
              productId: item.productId,
              name: item.name,
              sku: item.sku,
              sizeLabel: item.sizeLabel,
              unitNumber: i + 1,
              totalQuantity: item.quantity,
              requiresNumber: item.requiresNumber,
              requiresInitials: item.requiresInitials
            });
          }
        }
      });
      return units;
    }

    function analyzePersonalisation(units) {
      const groupedBySku = {};
      units.forEach(unit => {
        if (unit.requiresNumber) {
          if (!groupedBySku[unit.sku]) groupedBySku[unit.sku] = [];
          groupedBySku[unit.sku].push(unit);
        }
      });

      const analysis = {};
      Object.keys(groupedBySku).forEach(sku => {
        const skuUnits = groupedBySku[sku];
        const counts = {};
        const assigned = [];

        skuUnits.forEach(u => {
          const val = (state.personalisationValues[u.unitKey] || '').trim();
          if (val && !isNaN(val)) {
            const num = parseInt(val, 10);
            assigned.push(num);
            counts[num] = (counts[num] || 0) + 1;
          }
        });

        const duplicates = new Set(
          Object.keys(counts)
            .filter(numStr => counts[numStr] > 1)
            .map(numStr => parseInt(numStr, 10))
        );

        let nextFree = 1;
        while (assigned.includes(nextFree) && nextFree <= 99) {
          nextFree++;
        }

        analysis[sku] = {
          assignedList: Array.from(new Set(assigned)).sort((a, b) => a - b),
          duplicates,
          nextFree: nextFree <= 99 ? nextFree : null
        };
      });

      let duplicateCount = 0;
      units.forEach(unit => {
        if (unit.requiresNumber) {
          const val = (state.personalisationValues[unit.unitKey] || '').trim();
          if (val) {
            const num = parseInt(val, 10);
            const skuInfo = analysis[unit.sku];
            if (skuInfo && skuInfo.duplicates.has(num)) {
              duplicateCount++;
            }
          }
        }
      });

      return {
        groupedBySku,
        analysis,
        hasErrors: duplicateCount > 0,
        duplicateCount
      };
    }

    function getFinalizedOrderItems() {
      return state.cart.map(item => {
        const itemPersonalisations = [];
        if (item.requiresNumber || item.requiresInitials) {
          for (let i = 0; i < item.quantity; i++) {
            const key = `${item.cartItemId}_unit_${i}`;
            const val = state.personalisationValues[key] || '';
            if (val.trim()) {
              itemPersonalisations.push(val.trim());
            }
          }
        }
        return {
          ...item,
          lineTotal: item.unitPrice * item.quantity,
          personalisations: itemPersonalisations
        };
      });
    }

    function getFormattedOrderText() {
      const orderDate = new Date().toLocaleDateString('en-GB', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });
      const finalizedItems = getFinalizedOrderItems();
      const totalItemsCount = getTotalItemsCount();
      const grandTotal = getGrandTotal();

      let text = `WHITBURN PANTHERS FC - KIT ORDER 2026\n`;
      text += `=====================================\n`;
      text += `Date: ${orderDate}\n`;
      text += `Coach Name: ${state.coachDetails.name || 'N/A'}\n`;
      text += `Team / Age Group: ${state.coachDetails.teamName || 'N/A'}\n\n`;
      text += `ITEMIZED ORDER SUMMARY (${totalItemsCount} Total Items):\n`;
      text += `-------------------------------------\n`;

      finalizedItems.forEach((item, idx) => {
        text += `${idx + 1}. ${item.name} (${item.sku})\n`;
        text += `   Size: ${item.sizeLabel} | Qty: ${item.quantity} x £${item.unitPrice.toFixed(2)} = £${item.lineTotal.toFixed(2)}\n`;

        if (item.requiresNumber && item.personalisations.length > 0) {
          text += `   Squad Numbers: ${item.personalisations.map(n => `#${n}`).join(', ')}\n`;
        } else if (item.requiresNumber) {
          text += `   Squad Numbers: None specified\n`;
        }

        if (item.requiresInitials && item.personalisations.length > 0) {
          text += `   Initials: ${item.personalisations.join(', ')}\n`;
        } else if (item.requiresInitials) {
          text += `   Initials: None specified\n`;
        }

        text += `\n`;
      });

      text += `-------------------------------------\n`;
      text += `GRAND TOTAL: £${grandTotal.toFixed(2)}\n`;
      text += `=====================================\n`;
      text += `Generated via Whitburn Panthers Kit Order Wizard`;

      return text;
    }

    // =========================================================================
    // 6. EVENT HANDLERS & ACTIONS
    // =========================================================================
    function goToStep(step) {
      if (step === 2 && (!state.coachDetails.name.trim() || !state.coachDetails.teamName.trim())) {
        showToast('Please enter Coach Name & Team Name first');
        return;
      }
      if (step > 2 && state.cart.length === 0) {
        showToast('Please select kit items first');
        return;
      }
      if (step === 4) {
        const units = getExpandedPersonalisationUnits();
        const { hasErrors } = analyzePersonalisation(units);
        if (hasErrors) {
          showToast('Please resolve duplicate squad numbers first');
          return;
        }
      }
      state.currentStep = step;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openProductModal(productId) {
      const product = PRODUCTS.find(p => p.id === productId);
      if (!product) return;
      state.activeProduct = product;
      state.selectedSize = product.sizes[0];
      state.quantity = 1;
      renderModal();
    }

    function closeProductModal() {
      state.activeProduct = null;
      renderModal();
    }

    function selectModalSize(sizeCode) {
      if (!state.activeProduct) return;
      const size = state.activeProduct.sizes.find(s => s.code === sizeCode);
      if (size) {
        state.selectedSize = size;
        renderModal();
      }
    }

    function updateModalQuantity(delta) {
      state.quantity = Math.max(1, state.quantity + delta);
      renderModal();
    }

    function addToCartFromModal() {
      if (!state.activeProduct || !state.selectedSize) return;
      const existingIndex = state.cart.findIndex(
        item => item.productId === state.activeProduct.id && item.sizeCode === state.selectedSize.code
      );

      if (existingIndex > -1) {
        state.cart[existingIndex].quantity += state.quantity;
      } else {
        state.cart.push({
          cartItemId: `${state.activeProduct.id}_${state.selectedSize.code}_${Date.now()}`,
          productId: state.activeProduct.id,
          name: state.activeProduct.name,
          sku: state.activeProduct.sku,
          category: state.activeProduct.category,
          sizeCode: state.selectedSize.code,
          sizeLabel: state.selectedSize.label,
          unitPrice: state.selectedSize.price,
          quantity: state.quantity,
          requiresNumber: state.activeProduct.requiresNumber,
          requiresInitials: state.activeProduct.requiresInitials
        });
      }

      const addedName = state.activeProduct.name;
      const addedSize = state.selectedSize.code;
      state.activeProduct = null;
      renderAll();
      showToast(`Added ${addedName} (${addedSize}) to order`);
    }

    function updateCartQuantity(cartItemId, delta) {
      state.cart = state.cart
        .map(item => {
          if (item.cartItemId === cartItemId) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        })
        .filter(Boolean);
      renderHeader();
      renderStep2Lists();
      renderFooter();
    }

    function removeCartItem(cartItemId) {
      state.cart = state.cart.filter(item => item.cartItemId !== cartItemId);
      renderHeader();
      renderStep2Lists();
      renderFooter();
      showToast('Item removed from order');
    }

    function handleSquadNumberInput(unitKey, rawVal, inputEl) {
      let warning = null;
      if (/\D/.test(rawVal)) {
        warning = 'Numeric digits only allowed (1–99)';
      }
      let cleaned = rawVal.replace(/\D/g, '');
      if (cleaned.length > 0) {
        cleaned = String(parseInt(cleaned, 10) || '');
      }
      if (cleaned.length > 2) {
        cleaned = cleaned.slice(0, 2);
        warning = 'Maximum 2 digits allowed (numbers 1–99 only)';
      }
      if (cleaned && parseInt(cleaned, 10) > 99) {
        cleaned = '99';
        warning = 'Maximum squad number allowed is 99';
      }

      state.unitValidationWarnings[unitKey] = warning;
      state.personalisationValues[unitKey] = cleaned;

      // Keep sanitized value synced in the active input without losing mobile keyboard focus
      if (inputEl && inputEl.value !== cleaned) {
        inputEl.value = cleaned;
      }

      refreshStep3ValidationUI();
    }

    function assignNextFreeNumber(unitKey, sku) {
      const units = getExpandedPersonalisationUnits();
      const { analysis } = analyzePersonalisation(units);
      const nextFree = analysis[sku]?.nextFree;
      if (nextFree) {
        state.personalisationValues[unitKey] = String(nextFree);
        state.unitValidationWarnings[unitKey] = null;
        renderMain();
        showToast(`Assigned next free squad number #${nextFree}`);
      }
    }

    function handleInitialsInput(unitKey, rawVal, inputEl) {
      const upper = rawVal.toUpperCase();
      state.personalisationValues[unitKey] = upper;
      if (inputEl && inputEl.value !== upper) {
        inputEl.value = upper;
      }
    }

    // Iframe-safe copy using document.execCommand('copy')
    function copyOrderText() {
      const text = getFormattedOrderText();
      const helper = document.getElementById('clipboard-helper');
      helper.value = text;
      helper.select();
      helper.setSelectionRange(0, text.length);

      let copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (e) {
        copied = false;
      }

      if (!copied && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      }

      state.copiedSuccess = true;
      renderMain();
      showToast('Order details copied to clipboard!');
      setTimeout(() => {
        state.copiedSuccess = false;
        if (state.currentStep === 4) renderMain();
      }, 3000);
    }

    // CSV Download
    function downloadCSV() {
      const finalizedItems = getFinalizedOrderItems();
      const grandTotal = getGrandTotal();
      let csvContent = "Coach Name,Team / Age Group,SKU,Item Name,Size,Quantity,Unit Price (£),Line Total (£),Personalisation\n";

      finalizedItems.forEach(item => {
        const coach = `"${(state.coachDetails.name || '').replace(/"/g, '""')}"`;
        const team = `"${(state.coachDetails.teamName || '').replace(/"/g, '""')}"`;
        const name = `"${item.name.replace(/"/g, '""')}"`;
        const sku = `"${item.sku}"`;
        const size = `"${item.sizeLabel}"`;
        const qty = item.quantity;
        const unitPrice = item.unitPrice.toFixed(2);
        const lineTotal = item.lineTotal.toFixed(2);

        let persStr = 'N/A';
        if (item.requiresNumber) {
          persStr = item.personalisations.length > 0
            ? item.personalisations.map(n => `#${n}`).join(' | ')
            : 'None specified';
        } else if (item.requiresInitials) {
          persStr = item.personalisations.length > 0
            ? item.personalisations.join(' | ')
            : 'None specified';
        }

        const pers = `"${persStr.replace(/"/g, '""')}"`;
        csvContent += `${coach},${team},${sku},${name},${size},${qty},${unitPrice},${lineTotal},${pers}\n`;
      });

      csvContent += `,,,,,,GRAND TOTAL (£):,${grandTotal.toFixed(2)},\n`;

      try {
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const safeTeam = (state.coachDetails.teamName || 'Team').replace(/[^a-zA-Z0-9_-]/g, '_');
        link.href = url;
        link.setAttribute('download', `Whitburn_Panthers_Kit_Order_${safeTeam}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('CSV order sheet downloaded!');
      } catch (err) {
        showToast('Use "Copy Order Text" below if your browser blocks file downloads.');
      }
    }

    // Iframe-safe Mailto Trigger for Google Sites
    function submitOrderEmail() {
      const recipient = 'whitburnpanthers@gmail.com';
      const teamPart = state.coachDetails.teamName.trim() || 'Unknown Team';
      const coachPart = state.coachDetails.name.trim() || 'Unknown Coach';
      const subject = `NEW TOTAL SPORT ORDER REQUEST + ${teamPart} ${coachPart}`;
      const body = getFormattedOrderText();
      const mailtoUrl = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

      // Trigger at top level to bypass Google Sites iframe sandboxing on mobile
      try {
        const a = document.createElement('a');
        a.href = mailtoUrl;
        a.target = '_top';
        a.rel = 'noopener noreferrer';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (e) {
        window.location.href = mailtoUrl;
      }

      showToast('Opening your email app to submit order...');
    }

      footerEl.className = 'fixed bottom-0 left-0 right-0 z-20 bg-slate-950/95 backdrop-blur-md border-t border-red-900/50 p-3 shadow-2xl';
      footerEl.innerHTML = `
        <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
          <div>
            <span class="text-[10px] text-slate-400 uppercase tracking-wider block font-medium">
              ${totalItemsCount} ${totalItemsCount === 1 ? 'item' : 'items'} selected
            </span>
            <span class="text-xl font-black text-white">£${grandTotal.toFixed(2)}</span>
          </div>

          <button
            type="button"
            onclick="goToStep(3)"
            class="bg-red-600 hover:bg-red-700 active:scale-95 text-white font-extrabold px-6 py-3.5 rounded-xl shadow-lg transition flex items-center gap-2 text-sm"
          >
            <span>Next: Personalisation</span>
            ${ICONS.chevronRight}
          </button>
        </div>
      `;
    }

    function renderAll() {
      renderHeader();
      renderMain();
      renderModal();
      renderFooter();
    }

    // Initialize Application
    renderAll();
  </script>
</body>
</html>
