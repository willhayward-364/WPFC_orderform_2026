        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      container.innerHTML = `
        <div class="bg-red-600 text-white px-4 py-2 rounded-full shadow-2xl font-bold text-xs flex items-center gap-2 border border-red-400 whitespace-nowrap">
          ${ICONS.sparkles}
          <span>${escapeHtml(msg)}</span>
        </div>
      `;
      container.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        container.classList.add('hidden');
      }, 3000);
    }

    // =========================================================================
    // 5. COMPUTED HELPERS & VALIDATION
    // =========================================================================
    function getTotalItemsCount() {
      return state.cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function getGrandTotal() {
      return state.cart.reduce((sum, item) => sum + (item.unitPrice * item.quantity), 0);
    }

    function getFilteredProducts() {
      const q = state.searchQuery.toLowerCase().trim();
      return PRODUCTS.filter(p => {
        const matchesCat = state.selectedCategory === 'All' || p.category === state.selectedCategory;
        const matchesSearch = !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });
    }

    function getExpandedPersonalisationUnits() {
      const units = [];
      state.cart.forEach(item => {
        if (item.requiresNumber || item.requiresInitials) {
          for (let i = 0; i < item.quantity; i++) {
            units.push({
              unitKey: `${item.cartItemId}_unit_${i}`,
              cartItemId: item.cartItemId,
              productId: item.productId,
              name: item.name,
              sku: item.sku,
              sizeLabel: item.sizeLabel,
              unitNumber: i + 1,
              totalQuantity: item.quantity,
              requiresNumber: item.requiresNumber,
              requiresInitials: item.requiresInitials
            });
          }
        }
      });
      return units;
    }

    function getSquadNumberUnitsBySku() {
      const grouped = {};
      getExpandedPersonalisationUnits().forEach(unit => {
        if (unit.requiresNumber) {
          if (!grouped[unit.sku]) grouped[unit.sku] = [];
          grouped[unit.sku].push(unit);
        }
      });
      return grouped;
    }

    function getSkuPersonalisationAnalysis() {
      const grouped = getSquadNumberUnitsBySku();
      const analysis = {};

      Object.keys(grouped).forEach(sku => {
        const units = grouped[sku];
        const counts = {};
        const assigned = [];

        units.forEach(u => {
          const val = (state.personalisationValues[u.unitKey] || '').trim();
          if (val && !isNaN(val)) {
            const num = parseInt(val, 10);
            assigned.push(num);
            counts[num] = (counts[num] || 0) + 1;
          }
        });

        const duplicates = new Set(
          Object.keys(counts)
            .filter(numStr => counts[numStr] > 1)
            .map(numStr => parseInt(numStr, 10))
        );

        let nextFree = 1;
        while (assigned.includes(nextFree) && nextFree <= 99) {
          nextFree++;
        }

        analysis[sku] = {
          assignedList: Array.from(new Set(assigned)).sort((a, b) => a - b),
          duplicates,
          nextFree: nextFree <= 99 ? nextFree : null
        };
      });

      return analysis;
    }

    function getPersonalisationErrorSummary() {
      const units = getExpandedPersonalisationUnits();
      const analysis = getSkuPersonalisationAnalysis();
      let duplicateCount = 0;

      units.forEach(unit => {
        if (unit.requiresNumber) {
          const val = (state.personalisationValues[unit.unitKey] || '').trim();
          if (val) {
            const num = parseInt(val, 10);
            if (analysis[unit.sku] && analysis[unit.sku].duplicates.has(num)) {
              duplicateCount++;
            }
          }
        }
      });

      return {
        hasErrors: duplicateCount > 0,
        duplicateCount
      };
    }

    function getFinalizedOrderItems() {
      return state.cart.map(item => {
        const itemPersonalisations = [];
        if (item.requiresNumber || item.requiresInitials) {
          for (let i = 0; i < item.quantity; i++) {
            const key = `${item.cartItemId}_unit_${i}`;
            const val = state.personalisationValues[key] || '';
            if (val.trim()) {
              itemPersonalisations.push(val.trim());
            }
          }
        }
        return {
          ...item,
          lineTotal: item.unitPrice * item.quantity,
          personalisations: itemPersonalisations
        };
      });
    }

    function getOrderFilename(extension) {
      const safeTeam = (state.coachDetails.teamName || 'Team').trim().replace(/[^a-zA-Z0-9_-]+/g, '_');
      const safeCoach = (state.coachDetails.name || 'Coach').trim().replace(/[^a-zA-Z0-9_-]+/g, '_');
      return `WPFC_Kit_Order_2026_${safeTeam}_${safeCoach}.${extension}`;
    }

    function getEmailSubject() {
      const teamPart = state.coachDetails.teamName.trim() || 'Unknown Team';
      const coachPart = state.coachDetails.name.trim() || 'Unknown Coach';
      return `NEW TOTAL SPORT ORDER REQUEST + ${teamPart} ${coachPart}`;
    }

    function getShortEmailCoverNote() {
      const totalItemsCount = getTotalItemsCount();
      const grandTotal = getGrandTotal();
      return [
        `Hi Club Kit Secretary,`,
        ``,
        `Please find attached the formatted 2026 kit order form for ${state.coachDetails.teamName || 'N/A'} (Coach: ${state.coachDetails.name || 'N/A'}).`,
        `Total Garments/Items: ${totalItemsCount} | Estimated Total: £${grandTotal.toFixed(2)}`,
        ``,
        `Please review and check the attached order form before forwarding onwards to Total Sport.`
      ].join('\n');
    }

    function buildCSVContent() {
      const finalizedItems = getFinalizedOrderItems();
      const grandTotal = getGrandTotal();
      let csvContent = "Coach Name,Team / Age Group,SKU Code,Item Description,Size,Quantity,Unit Price (£),Line Total (£),Squad Numbers,Initials,Club Official Checked\n";

      finalizedItems.forEach(item => {
        const coach = `"${(state.coachDetails.name || '').replace(/"/g, '""')}"`;
        const team = `"${(state.coachDetails.teamName || '').replace(/"/g, '""')}"`;
        const sku = `"${item.sku}"`;
        const name = `"${item.name.replace(/"/g, '""')}"`;
        const size = `"${item.sizeLabel}"`;
        const qty = item.quantity;
        const unitPrice = item.unitPrice.toFixed(2);
        const lineTotal = item.lineTotal.toFixed(2);

        const numbersStr = item.requiresNumber
          ? (item.personalisations.length > 0 ? item.personalisations.map(n => `#${n}`).join(' | ') : 'None specified')
          : 'N/A';
        const initialsStr = item.requiresInitials
          ? (item.personalisations.length > 0 ? item.personalisations.join(' | ') : 'None specified')
          : 'N/A';

        csvContent += `${coach},${team},${sku},${name},${size},${qty},${unitPrice},${lineTotal},"${numbersStr.replace(/"/g, '""')}","${initialsStr.replace(/"/g, '""')}","[ ]"\n`;
      });

      csvContent += `,,,,,,GRAND TOTAL (£):,${grandTotal.toFixed(2)},,,\n`;
      return csvContent;
    }

            </td>

      }).join('');

      return `<!DOCTYPE html>

    // =========================================================================

    function goToStep(step) {
      if (step === 2 && (!state.coachDetails.name.trim() || !state.coachDetails.teamName.trim())) {
        showToast('Please enter Coach Name & Team Name first');
        return;
      }
      if (step > 2 && state.cart.length === 0) {
        showToast('Please select kit items first');
        return;
      }
      if (step === 4 && getPersonalisationErrorSummary().hasErrors) {
        showToast('Please resolve duplicate squad numbers before continuing');
        return;
      }
      state.currentStep = step;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateCoachField(field, value) {
      state.coachDetails[field] = value;
    }

    function setCategory(cat) {
      state.selectedCategory = cat;
      renderMain();
    }

    function handleSearch(val) {
      state.searchQuery = val;
      const listEl = document.getElementById('catalog-list');
      if (listEl) {
        listEl.innerHTML = renderCatalogItemsHTML();
      }
    }

    function openProductModal(productId) {
      const product = PRODUCTS.find(p => p.id === productId);
      if (!product) return;
      state.activeProduct = product;
      state.selectedSize = product.sizes[0];
      state.quantity = 1;
      renderModal();
    }

    function closeProductModal() {
      state.activeProduct = null;
      renderModal();
    }

    function selectModalSize(sizeCode) {
      if (!state.activeProduct) return;
      const sz = state.activeProduct.sizes.find(s => s.code === sizeCode);
      if (sz) {
        state.selectedSize = sz;
        renderModal();
      }
    }

    function updateModalQuantity(delta) {
      state.quantity = Math.max(1, state.quantity + delta);
      renderModal();
    }

    function addToCartFromModal() {
      if (!state.activeProduct || !state.selectedSize) return;
      const p = state.activeProduct;
      const sz = state.selectedSize;

      const existingIdx = state.cart.findIndex(
        item => item.productId === p.id && item.sizeCode === sz.code
      );

      if (existingIdx > -1) {
        state.cart[existingIdx].quantity += state.quantity;
      } else {
        state.cart.push({
          cartItemId: `${p.id}_${sz.code}_${Date.now()}`,
          productId: p.id,
          name: p.name,
          sku: p.sku,
          category: p.category,
          sizeCode: sz.code,
          sizeLabel: sz.label,
          unitPrice: sz.price,
          quantity: state.quantity,
          requiresNumber: p.requiresNumber,
          requiresInitials: p.requiresInitials
        });
      }

      showToast(`Added ${p.name} (${sz.code}) to order`);
      state.activeProduct = null;
      renderAll();
    }

    function updateCartQuantity(cartItemId, delta) {
      state.cart = state.cart
        .map(item => {
          if (item.cartItemId === cartItemId) {
            const nextQty = item.quantity + delta;
            return nextQty > 0 ? { ...item, quantity: nextQty } : null;
          }
          return item;
        })
        .filter(Boolean);
      renderAll();
    }

    function removeCartItem(cartItemId) {
      state.cart = state.cart.filter(item => item.cartItemId !== cartItemId);
      showToast('Item removed from order');
      renderAll();
    }

    function handleSquadNumberChange(unitKey, rawVal) {
      let warning = null;
      if (/\D/.test(rawVal)) {
        warning = 'Numeric digits only allowed (1–99)';
      }
      let cleaned = rawVal.replace(/\D/g, '');
      if (cleaned.length > 0) {
        cleaned = String(parseInt(cleaned, 10) || '');
      }
      if (cleaned.length > 2) {
        cleaned = cleaned.slice(0, 2);
        warning = 'Maximum 2 digits allowed (numbers 1–99 only)';
      }
      if (cleaned && parseInt(cleaned, 10) > 99) {
        cleaned = '99';
        warning = 'Maximum squad number allowed is 99';
      }

      state.unitValidationWarnings[unitKey] = warning;
      state.personalisationValues[unitKey] = cleaned;
      renderMainAndRestoreFocus(unitKey);
    }

    function assignNextFreeNumber(unitKey, sku) {
      const analysis = getSkuPersonalisationAnalysis();
      const nextFree = analysis[sku] ? analysis[sku].nextFree : null;
      if (nextFree) {
        state.personalisationValues[unitKey] = String(nextFree);
        state.unitValidationWarnings[unitKey] = null;
        renderMain();
        showToast(`Assigned next free squad number #${nextFree}`);
      }
    }

    function handleInitialsChange(unitKey, rawVal) {
      state.personalisationValues[unitKey] = rawVal.toUpperCase().slice(0, 4);
      renderMainAndRestoreFocus(unitKey);
    }

    function renderMainAndRestoreFocus(unitKey) {
      renderMain();
      const inputEl = document.querySelector(`[data-unit-key="${unitKey}"]`);
      if (inputEl) {
        inputEl.focus();
        const len = inputEl.value.length;
        try {
          inputEl.setSelectionRange(len, len);
        } catch (e) {}
      }
    }

    // Copy club email, subject, and short cover note
    function copySubmissionDetails() {
      const text = [
        `To: whitburnpanthers@gmail.com`,
        `Subject: ${getEmailSubject()}`,
        ``,
        getShortEmailCoverNote()
      ].join('\n');

      const helper = document.getElementById('clipboard-helper');
      helper.value = text;
      helper.select();
      helper.setSelectionRange(0, text.length);

      let copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (e) {
        copied = false;
      }

      if (!copied && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      }

      state.copiedSuccess = true;
      renderMain();
      showToast('Club email & subject copied to clipboard!');
      setTimeout(() => {
        state.copiedSuccess = false;
        if (state.currentStep === 4) renderMain();
      }, 3000);
    }

    function triggerBlobDownload(content, mimeType, filename) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // Download Excel-ready CSV file
    function downloadCSV() {
      try {
        triggerBlobDownload(buildCSVContent(), 'text/csv;charset=utf-8;', getOrderFilename('csv'));
        showToast('Excel CSV order sheet downloaded!');
      } catch (err) {
        showToast('Unable to download file in this browser view.');
      }
    }

    // Download Standalone Formatted HTML Order Sheet
    function downloadFormattedOrderSheet() {
      try {
        triggerBlobDownload(buildFormattedOrderSheetHTML(), 'text/html;charset=utf-8;', getOrderFilename('html'));
        showToast('Formatted order sheet downloaded!');
      } catch (err) {
        showToast('Unable to download file in this browser view.');
      }
    }

    // Submit Formatted Order Attachment to Club for Checking
    function submitOrderEmail() {
      const recipient = 'whitburnpanthers@gmail.com';
      const subject = getEmailSubject();
      const coverNote = getShortEmailCoverNote();
      const htmlContent = buildFormattedOrderSheetHTML();
      const filename = getOrderFilename('html');

      // 1. Mobile Native Share Sheet (attaches formatted order sheet file directly into Mail / Gmail)
      try {
        const orderFile = new File([htmlContent], filename, { type: 'text/html' });
        if (navigator.canShare && navigator.canShare({ files: [orderFile] })) {
          navigator.share({
            title: subject,
            text: `To: ${recipient}\nSubject: ${subject}\n\n${coverNote}`,
            files: [orderFile]
          }).catch((err) => {
            if (err && err.name !== 'AbortError') {
              fallbackDownloadAndMailto(htmlContent, filename, recipient, subject, coverNote);
            }
          });
          showToast('Select your Mail app to send with attachment...');
          return;
        }
      } catch (e) {
        // Fall through to desktop/standard browser workflow
      }

      // 2. Desktop / Fallback Workflow: Download formatted file attachment + open concise email
      fallbackDownloadAndMailto(htmlContent, filename, recipient, subject, coverNote);
    }

    function fallbackDownloadAndMailto(htmlContent, filename, recipient, subject, coverNote) {
      try {
        triggerBlobDownload(htmlContent, 'text/html;charset=utf-8;', filename);
      } catch (e) {}

      const bodyWithAttachmentReminder = `${coverNote}\n\n[Attached File: ${filename}]`;
      const mailtoUrl = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyWithAttachmentReminder)}`;

      try {
        const a = document.createElement('a');
        a.href = mailtoUrl;
        a.target = '_top';
        a.rel = 'noopener noreferrer';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (e) {
        window.location.href = mailtoUrl;
      }

      showToast(`Downloaded ${filename} & opened email!`);
    }

                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
                      <div class="flex items-start gap-3">
                        ${getKitThumbnailHTML(item.sku, item.name, 'w-12 h-12 mt-0.5')}
                        <div class="space-y-1">
                          <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-bold text-slate-400">${idx + 1}.</span>
                            <span class="font-extrabold text-white">${escapeHtml(item.name)}</span>
                            <span class="text-[10px] font-mono text-slate-500">(${escapeHtml(item.sku)})</span>
                          </div>
                          <div class="text-slate-300 font-medium pl-4">
                            Size: <span class="font-bold text-white">${escapeHtml(item.sizeLabel)}</span> | Qty: <span class="font-bold text-white">${item.quantity}</span> x £${item.unitPrice.toFixed(2)}
                          </div>

                          ${item.requiresNumber ? `
                            <div class="pl-4 text-red-300 font-bold">
                              Squad Numbers: ${item.personalisations.length > 0 ? item.personalisations.map(n => `#${escapeHtml(n)}`).join(', ') : 'None specified'}
                            </div>
                          ` : ''}

                          ${item.requiresInitials ? `
                            <div class="pl-4 text-amber-300 font-bold">
                              Initials: ${item.personalisations.length > 0 ? escapeHtml(item.personalisations.join(', ')) : 'None specified'}
                            </div>
                          ` : ''}
                        </div>
                      </div>

                      <div class="text-right sm:border-l sm:border-slate-800 sm:pl-4">
                        <span class="font-black text-sm text-white block">
                          £${item.lineTotal.toFixed(2)}
                        </span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- FORMATTED ATTACHMENT & CLUB SUBMISSION SECTION -->
            <div class="space-y-3">
              <button
                type="button"
                onclick="submitOrderEmail()"
                class="w-full bg-red-600 hover:bg-red-700 active:scale-[0.99] text-white font-extrabold py-4 rounded-xl shadow-xl transition flex items-center justify-center gap-2 text-base tracking-wide"
              >
                ${ICONS.send}
                <span>Submit Order File to Club for Checking</span>
              </button>

              <p class="text-[11px] text-slate-400 text-center font-medium px-2 leading-relaxed">
                Generates a formatted, printable order sheet (<strong class="text-slate-200 font-mono">${escapeHtml(htmlFilename)}</strong>) for club approval. On mobile, select your Mail app to attach automatically; on PC, attach the downloaded file to the email that opens.
              </p>

              <!-- GENERATED ATTACHMENT & EMAIL DETAILS CARD -->
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 text-xs">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                  <span class="font-bold text-slate-300 uppercase tracking-wider text-[11px] flex items-center gap-1.5">
                    <span class="text-red-400">${ICONS.paperclip}</span>
                    <span>Generated Order Attachment Details</span>
                  </span>
                  <button
                    type="button"
                    onclick="copySubmissionDetails()"
                    class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-2.5 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5 text-[11px]"
                  >
                    ${state.copiedSuccess ? `<span class="text-emerald-400">${ICONS.check}</span>` : `<span class="text-slate-400">${ICONS.copy}</span>`}
                    <span>${state.copiedSuccess ? 'Copied!' : 'Copy Email & Subject'}</span>
                  </button>
                </div>

                <div class="grid grid-cols-1 gap-2 bg-slate-950 p-3 rounded-xl border border-slate-800/90">
                  <div>
                    <span class="text-slate-500 text-[10px] uppercase font-bold block">Send To:</span>
                    <span class="font-mono text-white font-semibold">whitburnpanthers@gmail.com</span>
                  </div>
                  <div>
                    <span class="text-slate-500 text-[10px] uppercase font-bold block">Email Subject:</span>
                    <span class="font-mono text-red-400 font-semibold break-all">${escapeHtml(subjectLine)}</span>
                  </div>
                  <div>
                    <span class="text-slate-500 text-[10px] uppercase font-bold block">Formatted Attachment File:</span>
                    <span class="font-mono text-emerald-400 font-semibold break-all">${escapeHtml(htmlFilename)}</span>
                  </div>
                </div>

                <!-- DIRECT FILE DOWNLOAD OPTIONS -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
                  <button
                    type="button"
                    onclick="downloadFormattedOrderSheet()"
                    class="bg-slate-950 hover:bg-slate-800 border border-slate-700 text-slate-200 font-bold py-3 px-3 rounded-xl shadow transition flex items-center justify-center gap-2 text-xs"
                  >
                    <span class="text-red-400">${ICONS.fileText}</span>
                    <span>Download Order Form (.html)</span>
                  </button>

                  <button
                    type="button"
                    onclick="downloadCSV()"
                    class="bg-slate-950 hover:bg-slate-800 border border-slate-700 text-slate-200 font-bold py-3 px-3 rounded-xl shadow transition flex items-center justify-center gap-2 text-xs"
                  >
                    <span class="text-emerald-400">${ICONS.download}</span>
                    <span>Download Excel Sheet (.csv)</span>
                  </button>
                </div>
                <p class="text-[10px] text-slate-500 text-center">
                  Both files include columns for SKU, Size, Qty, Squad Numbers, Initials, and a Club Official Check column.
                </p>
              </div>

              <button
                type="button"
                onclick="goToStep(2)"
                class="text-xs text-slate-400 hover:text-white underline block mx-auto py-2"
              >
                Edit Kit Items or Quantities
              </button>
            </div>
          </div>
        `;
      }
    }

    function renderModal() {
      const modalEl = document.getElementById('app-modal');
      if (!state.activeProduct) {
        modalEl.className = 'hidden';
        modalEl.innerHTML = '';
        return;
      }

      const product = state.activeProduct;
      const subtotal = state.selectedSize ? state.selectedSize.price * state.quantity : 0;

      modalEl.className = 'fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in';
      modalEl.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5 shadow-2xl space-y-5">
          <div class="flex items-start gap-3 border-b border-slate-800 pb-3">
            ${getKitThumbnailHTML(product.sku, product.name, 'w-16 h-16')}
            <div class="flex-1">
              <span class="text-[10px] font-bold text-red-400 bg-red-950 border border-red-800 px-2 py-0.5 rounded uppercase tracking-wider">
                ${escapeHtml(product.category)}
              </span>
              <h3 class="font-extrabold text-white text-lg mt-1 leading-snug">${escapeHtml(product.name)}</h3>
              <p class="text-xs font-mono text-slate-400">${escapeHtml(product.sku)}</p>
            </div>
            <button type="button" onclick="closeProductModal()" class="p-2 rounded-lg text-slate-400 hover:text-white bg-slate-950 border border-slate-800" aria-label="Close modal">
              ${ICONS.x}
            </button>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
              Select Size *
            </label>
            <div class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1">
              ${product.sizes.map(size => {
                const isSelected = state.selectedSize && state.selectedSize.code === size.code;
                return `
                  <button
                    type="button"
                    onclick="selectModalSize('${size.code}')"
                    class="p-3 rounded-xl border text-left flex justify-between items-center transition ${
                      isSelected
                        ? 'bg-red-600/20 border-red-500 text-white shadow'
                        : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-600'
                    }"
                  >
                    <span class="text-xs font-bold">${escapeHtml(size.label)}</span>
                    <span class="text-xs font-extrabold text-red-400">£${size.price.toFixed(2)}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="flex items-center justify-between border-t border-slate-800 pt-3">
            <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Quantity</span>
            <div class="flex items-center bg-slate-950 rounded-xl border border-slate-800">
              <button type="button" onclick="updateModalQuantity(-1)" class="p-3 text-slate-400 hover:text-white" aria-label="Decrease quantity">
                ${ICONS.minus}
              </button>
              <span class="w-10 text-center font-bold text-sm text-white">${state.quantity}</span>
              <button type="button" onclick="updateModalQuantity(1)" class="p-3 text-slate-400 hover:text-white" aria-label="Increase quantity">
                ${ICONS.plus}
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between border-t border-slate-800 pt-4">
            <div>
              <span class="text-[10px] text-slate-400 uppercase block font-medium">Subtotal</span>
              <span class="text-xl font-black text-red-500">£${subtotal.toFixed(2)}</span>
            </div>

            <button
              type="button"
              onclick="addToCartFromModal()"
              class="bg-red-600 hover:bg-red-700 active:scale-95 text-white font-extrabold px-6 py-3.5 rounded-xl shadow-lg transition flex items-center gap-2 text-sm"
            >
              ${ICONS.shoppingBag}
              <span>Add to Basket</span>
            </button>
          </div>
        </div>
      `;
    }

    function renderFooter() {
      const footerEl = document.getElementById('app-footer');
      if (state.currentStep !== 2) {
        footerEl.className = 'hidden';
        footerEl.innerHTML = '';
        return;
      }

      const totalItemsCount = getTotalItemsCount();
      const grandTotal = getGrandTotal();

      footerEl.className = 'fixed bottom-0 left-0 right-0 z-20 bg-slate-950/95 backdrop-blur-md border-t border-red-900/50 p-3 shadow-2xl';
      footerEl.innerHTML = `
        <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
          <div>
            <span class="text-[10px] text-slate-400 uppercase tracking-wider block font-medium">
              ${totalItemsCount} ${totalItemsCount === 1 ? 'item' : 'items'} selected
            </span>
            <span class="text-xl font-black text-white">£${grandTotal.toFixed(2)}</span>
          </div>

          <button
            type="button"
            onclick="goToStep(3)"
            class="bg-red-600 hover:bg-red-700 active:scale-95 text-white font-extrabold px-6 py-3.5 rounded-xl shadow-lg transition flex items-center gap-2 text-sm"
          >
            <span>Next: Personalisation</span>
            ${ICONS.chevronRight}
          </button>
        </div>
      `;
    }

    function renderAll() {
      renderHeader();
      renderMain();
      renderModal();
      renderFooter();
    }

    // Initialize Application
    renderAll();
  </script>
</body>
</html>
